<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR status</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7380;--bd:#e3e6eb;--ok:#1a8f4c;--okbg:#e5f5ec;--warn:#b26a00;--warnbg:#fff1d9;--bad:#c62f2f;--badbg:#fde7e7;--acc:#2f5fd0}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d22;--tx:#e8eaee;--mut:#8b93a0;--bd:#2a2f37;--ok:#4cc784;--okbg:#153223;--warn:#f0b45a;--warnbg:#3a2a10;--bad:#f27373;--badbg:#3a1717;--acc:#7c9cf5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 10px}
.sub{color:var(--mut);font-size:12px}
.banner{border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.banner small{display:block;font-weight:400;margin-top:2px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px}
.card,.sec{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.sec{margin-bottom:12px}
.k{color:var(--mut);font-size:12px}.v{font-size:24px;font-weight:700;margin:2px 0}.n{font-size:12px;color:var(--mut)}
.chip{border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-use{background:var(--bd);color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:13px;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
td.wrap{white-space:normal;min-width:220px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:13px}
.row:last-child{border:0}.row b{font-weight:600;text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.w{color:var(--warn)}.b{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>OCR status <span class="sub" id="model"></span></h1>
<div class="sub" id="upd">загрузка…</div>
<div id="conn"></div><div id="banner"></div>
<div class="grid" id="kpis"></div>
<div class="sec"><h2>Качество за час</h2><div class="grid" id="quality" style="margin:0"></div></div>
<div class="sec"><h2>Задания в памяти</h2><div class="scroll" id="jobs"></div></div>
<div class="sec"><h2>Клиенты</h2><div class="scroll" id="clients"></div></div>
<div class="sec"><h2>Ключи Gemini</h2><div class="scroll" id="keys"></div></div>
<div class="sec"><h2>Прокси за час</h2><div class="scroll" id="proxies"></div></div>
<div class="two">
  <div class="sec"><h2>События с запуска</h2><div id="counters"></div></div>
  <div class="sec"><h2>Конфигурация</h2><div id="cfg"></div></div>
</div>
<div class="sec"><h2>Supabase</h2><div id="sb"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=s=>s==null?'—':s<60?Math.round(s)+' с назад':s<3600?Math.floor(s/60)+' мин назад':Math.floor(s/3600)+' ч '+Math.floor(s%3600/60)+' мин назад';
const dur=ms=>ms==null?'—':ms<1000?ms+' мс':(ms/1000).toFixed(1)+' с';
const left=s=>s==null?'—':s<60?Math.round(s)+' с':Math.floor(s/60)+' мин';
const up=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+' д '+h+' ч':h?h+' ч '+m+' мин':m+' мин'};
const row=(a,b)=>'<div class="row"><span>'+a+'</span><b>'+b+'</b></div>';
const kpi=(k,v,n,c)=>'<div class="card"><div class="k">'+k+'</div><div class="v"'+(c?' style="color:var(--'+c+')"':'')+'>'+v+'</div><div class="n">'+(n||'')+'</div></div>';
const chip=(t,c)=>'<span class="chip c-'+c+'">'+esc(t)+'</span>';
const short=n=>String(n).replace(/^GEMINI_API_KEY_/,'');
const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—';
function table(head,rows){
  if(!rows.length)return '<div class="sub">пусто</div>';
  return '<table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td'+(c&&c.w?' class="wrap"':'')+'>'+(c&&c.w?c.h:c)+'</td>').join('')+'</tr>').join('')+'</table>';
}
const KEY_STATE={ready:['готов','ok'],in_use:['в работе','use'],cooldown:['пауза','warn'],billing:['блок биллинг','bad'],project:['блок проект','bad'],invalid:['мёртв','bad']};
const KEY_ORDER={billing:0,project:1,invalid:2,cooldown:3,in_use:4,ready:5};
const STAGE={processing:['обработка','use'],done:['готово','ok'],error:['ошибка','bad']};

function render(d){
  const A=d.attempts,Q=d.quality,K=d.keys,Z=d.queue;
  $('model').textContent='· '+(d.model||'—')+' · pid '+d.pid;
  // --- общая плашка: берётся самое плохое из условий ---
  let cls='ok',t='Работает',s=K.usable+' из '+K.total+' ключей доступны, очередь пуста';
  const bump=(c,tt,ss)=>{if(c==='bad'||(c==='warn'&&cls==='ok')){cls=c;t=tt;s=ss}};
  const fz=Q.cells?100*Q.final_zero/Q.cells:0;
  if(Z.pending)s=Z.pending+' ждут, '+Z.running+' идёт';
  if(Z.oldest_pending_s>30)bump('warn','Очередь стоит','Самое старое ожидающее задание '+Z.oldest_pending_s+' с');
  if(A.total>=30&&A.ok_pct!=null&&A.ok_pct<60)bump('warn','Gemini часто отвечает ошибкой','Успешно '+A.ok_pct+'% попыток за час');
  if(Q.cells>=54&&fz>10)bump('warn','Много нераспознанных','Нулей '+fz.toFixed(1)+'% за час');
  if(K.usable===0)bump('bad','Нет доступных ключей','Все на паузе, блоке или мертвы: ответы будут нулями');
  $('banner').innerHTML='<div class="banner b-'+cls+'">'+t+'<small>'+s+'</small></div>';
  // --- карточки ---
  $('kpis').innerHTML=
    kpi('Ключи готовы',K.usable+' / '+K.total,(K.by_state.cooldown||0)+' пауза · '+((K.by_state.billing||0)+(K.by_state.project||0))+' блок · '+(K.by_state.invalid||0)+' мёртв',K.usable<K.total?'warn':'ok')+
    kpi('Очередь',Z.pending+' ждут',Z.running+' идёт · старейшее '+Z.oldest_pending_s+' с · лимит '+Z.max_concurrency)+
    kpi('Успех попыток Gemini',A.ok_pct==null?'—':A.ok_pct+'%',A.ok+' из '+A.total+' за час · 429: '+A.n429,A.ok_pct!=null&&A.ok_pct<60?'warn':'ok')+
    kpi('Посл. успех Gemini',ago(A.last_ok_ago),'посл. ошибка: '+ago(A.last_err_ago))+
    kpi('Задания в памяти',Z.in_memory,'результат хранится '+Math.round(Z.result_ttl_s/60)+' мин')+
    kpi('Аптайм',up(d.uptime_s),'');
  // --- качество ---
  $('quality').innerHTML=
    kpi('Ячеек обработано',Q.cells,'')+
    kpi('Нулей с первого прохода',pct(Q.first_pass_zero,Q.cells),Q.first_pass_zero+' ячеек')+
    kpi('Спасено точечным повтором',Q.variant_saved,'из '+Q.first_pass_zero)+
    kpi('Ушло в ddddocr',Q.dddd_used,'спасено '+Q.dddd_saved)+
    kpi('Итоговых нулей',pct(Q.final_zero,Q.cells),Q.final_zero+' ячеек',fz>10?'warn':'')+
    kpi('Задания со всеми нулями',Q.all_zero_jobs_total,'с запуска',Q.all_zero_jobs_total?'bad':'');
  // --- задания ---
  $('jobs').innerHTML=table(['Задание','Клиент','Стадия','Картинок','Нулей','Ждало','Обработка','Возраст','Опросов','Посл. опрос','Результат'],
    d.jobs.map(j=>{
      let st=j.stage==='queued'?chip('в очереди #'+j.queue_position,'warn'):chip(...(STAGE[j.stage]||[j.stage,'use']));
      let res='—';
      if(j.stage==='done'||j.stage==='error'){
        res=(j.delivered_ago!=null?'забран '+ago(j.delivered_ago):'<span class="w">не забран</span>')+(j.expires_in!=null?' · удалится через '+left(j.expires_in):'');
        if(j.error)res+='<br><span class="b">'+esc(j.error)+'</span>';
      }
      return [esc(j.id)+'…<br><span class="sub">'+esc(j.request)+'</span>',esc(j.account),st,j.images==null?'—':j.images,j.zeros==null?'—':j.zeros,dur(j.queue_wait_ms),dur(j.processing_ms),left(j.age_s),j.polls,ago(j.last_poll_ago),res];
    }));
  // --- клиенты ---
  const CS={'активен':'ok','молчит':'warn','не забирает результат':'bad'};
  $('clients').innerHTML=table(['Клиент','Посл. submit','Посл. опрос','Результат забран','Заданий','Ошибок','Все нули','Не забрано сейчас','Статус'],
    d.clients.map(c=>[esc(c.id),ago(c.submit_ago),ago(c.poll_ago),ago(c.delivered_ago),c.jobs,c.errors,c.zero_jobs,c.undelivered,chip(c.status,CS[c.status]||'use')]));
  // --- ключи ---
  const kl=K.list.slice().sort((a,b)=>KEY_ORDER[a.state]-KEY_ORDER[b.state]);
  $('keys').innerHTML=table(['Ключ','Состояние','Взят','Посл. успех','Посл. ошибка','За час ок / ошибок','Что случилось'],
    kl.map(k=>{
      let why='';
      if(k.err_cat)why=esc(k.err_cat)+(k.err_http!=null?' · HTTP '+k.err_http:'')+(k.state==='cooldown'?' · пауза ещё ~'+Math.round(k.cooldown_left)+' с':'')+(k.state==='invalid'?' · ключ надо заменить':'')+(k.state==='billing'||k.state==='project'?' · нужен рестарт':'')+(k.err_msg?'<br><span class="sub">'+esc(k.err_msg)+'</span>':'');
      return [esc(short(k.name)),chip(...KEY_STATE[k.state]),ago(k.used_ago),ago(k.ok_ago),ago(k.err_ago),k.ok_1h+' / '+(k.err_1h?'<span class="w">'+k.err_1h+'</span>':0),{w:1,h:why}];
    }));
  // --- прокси: канал с p50 сильно выше медианы подсвечивается ---
  const p50s=d.proxies.list.map(p=>p.p50_ms).filter(x=>x!=null).sort((a,b)=>a-b);
  const med=p50s.length?p50s[Math.floor(p50s.length/2)]:null;
  $('proxies').innerHTML=table(['Канал','Состояние','Попыток','Успех','429','Обрывов','p50','p95','Подряд сбоев'],
    d.proxies.list.slice().sort((a,b)=>(b.p50_ms||0)-(a.p50_ms||0)).map(p=>{
      const slow=med&&p.p50_ms&&p.p50_ms>1.5*med;
      return [esc(p.label),p.state==='cooldown'?chip('пауза '+Math.round(p.cooldown_left)+' с','warn'):chip('работает','ok'),p.attempts,p.ok_pct==null?'—':p.ok_pct+'%',p.n429,p.proxy_err,
        '<span class="'+(slow?'b':'')+'">'+dur(p.p50_ms)+'</span>',dur(p.p95_ms),p.failures];
    }))+'<div class="sub" style="margin-top:6px">'+d.proxies.channels+' каналов (включая DIRECT) · '+esc(d.proxies.mode)+' · '+esc(d.proxies.source)+' · задержка = время всего запроса через канал; красным выделены каналы с p50 больше медианы в 1.5 раза</div>';
  // --- счётчики и конфиг ---
  const NAMES={accepted:'Принято',started:'Стартовало',done:'Готово',error:'Ошибок job',result_delivered:'Результат забран',expired:'Истекло',all_zero_jobs:'Все нули',betterstack_dropped:'Потеряно для Better Stack'};
  $('counters').innerHTML=Object.entries(d.counters).map(([k,v])=>row(esc(NAMES[k]||k),v)).join('');
  const C=d.config;
  $('cfg').innerHTML=row('Размер чанка',C.chunk_size)+row('Параллельных чанков',C.max_concurrent_chunks)+row('Точечный повтор',C.variant_retry?'вкл · мин. голосов '+C.variant_min_votes:'выкл')+row('Потоков ddddocr',C.ocr_max_workers)+row('Better Stack',C.betterstack?'вкл · '+esc(C.betterstack_service)+' · в очереди '+C.betterstack_queue:'выкл')+row('Пул перегружен',Z.pool_overloaded?'да · ещё '+Z.pool_overloaded_left+' с':'нет');
  $('sb').innerHTML=d.supabase.enabled?'подключён':'<span class="sub">В этой версии история в Supabase не пишется: блок появится после подключения записи.</span>';
}
async function tick(){
  try{
    const r=await fetch('/status.json',{cache:'no-store'});
    if(r.status===401){location.reload();return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
    $('conn').innerHTML='';
    $('upd').textContent='обновлено '+new Date().toLocaleTimeString('ru-RU')+' · каждые 5 с';
  }catch(e){
    $('conn').innerHTML='<div class="banner b-bad">Сервис не отвечает<small>'+esc(e.message)+' · показаны последние данные</small></div>';
  }
}
tick();setInterval(tick,5000);
</script>
</body>
</html>
